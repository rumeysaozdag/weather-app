    <g text-anchor="middle" class="white" font-size="14" font-weight="600"><text x="589" y="741">21°</text><text x="653" y="741">22°</text><text x="717" y="741">22°</text><text x="781" y="741">21°</text><text x="850" y="741">20°</text></g>
    <text x="555" y="790" class="white" font-size="16" font-weight="650">7 günlük görünüm</text>
    <rect x="550" y="803" width="340" height="36" rx="13" class="glass"/>
