<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" fill="none">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF5FA"/><stop offset="1" stop-color="#DCE8F1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#688597"/><stop offset=".55" stop-color="#405F78"/><stop offset="1" stop-color="#203650"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B5F0E8"/><stop offset="1" stop-color="#74CFC7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#203650" flood-opacity=".16"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="36"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .muted{fill:#D5E2EC}.white{fill:#fff}.soft{fill:#EFF6FA}.mint{fill:#B5F0E8}
      .phone{fill:url(#screen);stroke:#fff;stroke-opacity:.85;stroke-width:8}
      .glass{fill:#fff;fill-opacity:.13;stroke:#fff;stroke-opacity:.13;stroke-width:1.5}
      .outline{fill:none;stroke:#fff;stroke-opacity:.18;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="920" rx="36" fill="url(#page)"/>
  <circle cx="1335" cy="100" r="130" fill="#B5F0E8" opacity=".44" filter="url(#glow)"/>
  <circle cx="78" cy="836" r="130" fill="#B7C8FF" opacity=".36" filter="url(#glow)"/>
  <g>
    <rect x="80" y="74" width="56" height="56" rx="18" fill="#203650"/>
    <circle cx="106" cy="99" r="10" fill="#FFD54F"/>
    <path d="M94 113h24a8 8 0 0 0-2-15 11 11 0 0 0-20 4 6 6 0 0 0-2 11Z" fill="white"/>
    <text x="154" y="104" font-size="24" font-weight="750" fill="#203650">HAVADAŞ</text>
    <text x="80" y="193" font-size="48" font-weight="750" fill="#203650">Bugün gökyüzünde ne var?</text>
    <text x="82" y="232" font-size="20" fill="#587187">Şehir arama, hava tahmini ve günlük planın tek yerde.</text>
    <text x="1360" y="108" text-anchor="end" font-size="13" font-weight="650" letter-spacing="2.2" fill="#587187">ANDROID UYGULAMASI · ARAYÜZ ÖNİZLEMESİ</text>
  </g>

  <!-- Search screen -->
  <g filter="url(#shadow)">
