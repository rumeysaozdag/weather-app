    <text x="175" y="624" class="white" font-size="16" font-weight="650">Ankara</text><text x="175" y="646" class="muted" font-size="12">Türkiye · Trabzon</text><text x="415" y="637" text-anchor="end" class="mint" font-size="20">☆</text>
    <rect x="102" y="779" width="344" height="62" rx="0" fill="#203650" fill-opacity=".64"/>
    <text x="158" y="805" text-anchor="middle" class="mint" font-size="16">⌕</text><text x="158" y="826" text-anchor="middle" class="soft" font-size="10">Ara</text>
    <text x="274" y="805" text-anchor="middle" class="muted" font-size="16">☂</text><text x="274" y="826" text-anchor="middle" class="muted" font-size="10">Yol</text>
