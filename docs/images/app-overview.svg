    <g>
      <rect x="997" y="746" width="50" height="62" rx="15" class="glass"/><text x="1022" y="767" text-anchor="middle" class="muted" font-size="10">14:00</text><text x="1022" y="792" text-anchor="middle" class="white" font-size="14">%10</text>
      <rect x="1056" y="746" width="50" height="62" rx="15" class="glass"/><text x="1081" y="767" text-anchor="middle" class="muted" font-size="10">15:00</text><text x="1081" y="792" text-anchor="middle" class="white" font-size="14">%5</text>
      <rect x="1115" y="746" width="50" height="62" rx="15" class="glass"/><text x="1140" y="767" text-anchor="middle" class="muted" font-size="10">16:00</text><text x="1140" y="792" text-anchor="middle" class="white" font-size="14">%10</text>
      <rect x="1174" y="746" width="50" height="62" rx="15" class="glass"/><text x="1199" y="767" text-anchor="middle" class="muted" font-size="10">17:00</text><text x="1199" y="792" text-anchor="middle" class="white" font-size="14">%15</text>
      <rect x="1233" y="746" width="50" height="62" rx="15" class="glass"/><text x="1258" y="767" text-anchor="middle" class="muted" font-size="10">18:00</text><text x="1258" y="792" text-anchor="middle" class="white" font-size="14">%20</text>
      <rect x="1292" y="746" width="43" height="62" rx="15" class="glass"/><text x="1313" y="767" text-anchor="middle" class="muted" font-size="10">19:00</text><text x="1313" y="792" text-anchor="middle" class="white" font-size="14">%15</text>
    </g>
    <text x="1000" y="836" class="muted" font-size="10">Hava tahminine dayalıdır; canlı trafik ve rota içermez.</text>
